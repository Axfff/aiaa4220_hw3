# @package _global_
# Evaluation config for falcon_hm3d_train_2v100_ellipse.yaml
# Full Model: ResNet50 + LSTM512 with Velocity-Aware Elliptical Penalty
#
# KEY FEATURES:
# 1. Elliptical Proximity Penalty (velocity-aware for humans)
#    - Requires human_velocity_sensor in obs_keys
#    - Penalty zone expands 2x in direction of human movement
#    - Penalty zone shrinks 0.5x behind moving humans
#
# 2. Obstacle Proximity Penalty (depth-based for static obstacles)
#    - Uses agent_0_articulated_agent_jaw_depth sensor
#    - Soft penalty when approaching walls/obstacles within 1.0m
#    - Default: penalty=-0.0015, threshold=1.0m (from falcon_task_detail.yaml)
#    - Gentler than human penalty to provide smooth guidance
#
# Usage:
#   python -u -m habitat-baselines.habitat_baselines.run \
#     --config-name=social_nav_v2/falcon_hm3d_2v100_ellipse_eval.yaml \
#     habitat_baselines.num_environments=4 \
#     habitat.dataset.data_path=data/datasets/pointnav/social-hm3d/minival/minival.json.gz \
#     habitat_baselines.eval_ckpt_path_dir=evaluation/falcon/lr_schedule_hm3d_2v100_ellipse/checkpoints/eval.pth
#
# With video:
#   python -u -m habitat-baselines.habitat_baselines.run \
#     --config-name=social_nav_v2/falcon_hm3d_2v100_ellipse_eval.yaml \
#     habitat_baselines.num_environments=4 \
#     habitat.dataset.data_path=data/datasets/pointnav/social-hm3d/minival/minival.json.gz \
#     habitat_baselines.eval_ckpt_path_dir=evaluation/falcon/lr_schedule_hm3d_2v100_ellipse/checkpoints/eval.pth \
#     habitat_baselines.video_dir=evaluation/falcon/lr_schedule_hm3d_2v100_ellipse/video \
#     habitat_baselines.eval.video_option=[\"disk\"]

defaults:
  - /benchmark/nav/socialnav_v2: falcon_hm3d_task
  - /habitat_baselines: habitat_baselines_rl_config_base
  - /habitat/simulator/sim_sensors@habitat_baselines.eval.extra_sim_sensors.third_rgb_sensor: third_rgb_sensor
  - /habitat_baselines/rl/policy@habitat_baselines.rl.policy.agent_1: single_fixed
  - /habitat_baselines/rl/policy@habitat_baselines.rl.policy.agent_2: single_fixed
  - /habitat_baselines/rl/policy@habitat_baselines.rl.policy.agent_3: single_fixed
  - /habitat_baselines/rl/policy@habitat_baselines.rl.policy.agent_4: single_fixed
  - /habitat_baselines/rl/policy@habitat_baselines.rl.policy.agent_5: single_fixed
  - /habitat_baselines/rl/policy@habitat_baselines.rl.policy.agent_6: single_fixed
  - /habitat/task/actions@habitat.task.actions.agent_0_discrete_stop: discrete_stop
  - /habitat/task/actions@habitat.task.actions.agent_0_discrete_move_forward: discrete_move_forward
  - /habitat/task/actions@habitat.task.actions.agent_0_discrete_turn_left: discrete_turn_left
  - /habitat/task/actions@habitat.task.actions.agent_0_discrete_turn_right: discrete_turn_right
  - /habitat/task/actions@habitat.task.actions.agent_1_oracle_nav_randcoord_action_obstacle: oracle_nav_action
  - /habitat/task/actions@habitat.task.actions.agent_2_oracle_nav_randcoord_action_obstacle: oracle_nav_action
  - /habitat/task/actions@habitat.task.actions.agent_3_oracle_nav_randcoord_action_obstacle: oracle_nav_action
  - /habitat/task/actions@habitat.task.actions.agent_4_oracle_nav_randcoord_action_obstacle: oracle_nav_action
  - /habitat/task/actions@habitat.task.actions.agent_5_oracle_nav_randcoord_action_obstacle: oracle_nav_action
  - /habitat/task/actions@habitat.task.actions.agent_6_oracle_nav_randcoord_action_obstacle: oracle_nav_action
  - /habitat/task/lab_sensors@habitat.task.lab_sensors.agent_0_pointgoal_with_gps_compass: pointgoal_with_gps_compass_sensor
  - _self_

habitat:
  environment:
    iterator_options:
      shuffle: False  # keep the same order for reproducible evaluation
  gym:
    obs_keys:
      # Only include sensors needed for inference (including velocity sensor for elliptical penalty)
      - agent_0_articulated_agent_jaw_depth
      - agent_0_pointgoal_with_gps_compass
      - human_velocity_sensor  # ADDED: Required for elliptical penalty during evaluation
  task:
    actions:
      agent_0_discrete_stop:
        lin_speed: 0.0
        ang_speed: 0.0
      agent_0_discrete_move_forward:
        lin_speed: 25.0
        ang_speed: 0.0
        allow_dyn_slide: True
      agent_0_discrete_turn_left:
        lin_speed: 0.0
        ang_speed: 10.0
        allow_dyn_slide: True
      agent_0_discrete_turn_right:
        lin_speed: 0.0
        ang_speed: -10.0
        allow_dyn_slide: True
      agent_1_oracle_nav_randcoord_action_obstacle:
        type: OracleNavRandCoordAction_Obstacle
        motion_control: human_joints
        lin_speed: 10.0
        ang_speed: 10.0
        allow_dyn_slide: True
      agent_2_oracle_nav_randcoord_action_obstacle:
        type: OracleNavRandCoordAction_Obstacle
        motion_control: human_joints
        lin_speed: 10.0
        ang_speed: 10.0
        allow_dyn_slide: True
      agent_3_oracle_nav_randcoord_action_obstacle:
        type: OracleNavRandCoordAction_Obstacle
        motion_control: human_joints
        lin_speed: 10.0
        ang_speed: 10.0
        allow_dyn_slide: True
      agent_4_oracle_nav_randcoord_action_obstacle:
        type: OracleNavRandCoordAction_Obstacle
        motion_control: human_joints
        lin_speed: 10.0
        ang_speed: 10.0
        allow_dyn_slide: True
      agent_5_oracle_nav_randcoord_action_obstacle:
        type: OracleNavRandCoordAction_Obstacle
        motion_control: human_joints
        lin_speed: 10.0
        ang_speed: 10.0
        allow_dyn_slide: True
      agent_6_oracle_nav_randcoord_action_obstacle:
        type: OracleNavRandCoordAction_Obstacle
        motion_control: human_joints
        lin_speed: 10.0
        ang_speed: 10.0
        allow_dyn_slide: True

habitat_baselines:
  evaluate: True
  verbose: True
  trainer_name: "ddppo"
  torch_gpu_id: 0
  tensorboard_dir: "evaluation/falcon/lr_schedule_hm3d_2v100_ellipse/tb"
  video_dir: "evaluation/falcon/lr_schedule_hm3d_2v100_ellipse/video"
  test_episode_count: -1

  # Default checkpoint path - override with command line
  eval_ckpt_path_dir: "evaluation/falcon/lr_schedule_hm3d_2v100_ellipse/checkpoints/eval.pth"

  num_environments: 8
  checkpoint_folder: "evaluation/falcon/lr_schedule_hm3d_2v100_ellipse/checkpoints"
  num_updates: -1
  total_num_steps: 1e8
  log_interval: 10
  num_checkpoints: 200

  # Force PyTorch to be single threaded for better eval performance
  force_torch_single_threaded: True

  load_resume_state_config: False

  evaluator:
    _target_: habitat_baselines.rl.ppo.falcon_evaluator.FALCONEvaluator

  eval:
    use_ckpt_config: False
    should_load_ckpt: True
    # video_option: ["disk"]

  rl:
    agent:
      type: "MultiAgentAccessMgr"
      num_agent_types: 7
      num_active_agents_per_type: [1, 1, 1, 1, 1, 1, 1]
      num_pool_agents_per_type: [1, 1, 1, 1, 1, 1, 1]
      agent_sample_interval: 20
      force_partner_sample_idx: -1
    policy:
      agent_0:
        name: "PointNavResNetPolicy"
    ppo:
      # PPO params (only used for model architecture during loading)
      clip_param: 0.2
      ppo_epoch: 4
      num_mini_batch: 4
      value_loss_coef: 0.5
      entropy_coef: 0.01
      lr: 2.0e-4
      eps: 1e-5
      max_grad_norm: 0.2
      num_steps: 128
      use_gae: True
      gamma: 0.99
      tau: 0.95
      use_linear_clip_decay: False
      use_linear_lr_decay: False
      reward_window_size: 50
      use_normalized_advantage: False

      # Full model size (must match training config)
      hidden_size: 512

      use_double_buffered_sampler: False

    ddppo:
      sync_frac: 0.6
      distrib_backend: NCCL
      pretrained_weights: pretrained_model/pretrained_habitat3.pth
      pretrained: True
      pretrained_encoder: False
      train_encoder: True
      reset_critic: True

      # Full model backbone (must match training config)
      backbone: resnet50
      rnn_type: LSTM
      num_recurrent_layers: 2
