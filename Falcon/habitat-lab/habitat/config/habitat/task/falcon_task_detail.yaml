defaults:
  - task_config_base
  - measurements:
    - distance_to_goal
    - distance_to_goal_reward
    - multi_agent_nav_reward # for falcon
    - success
    - did_multi_agents_collide
    - num_steps
    - top_down_map
    - spl
    - psc
    - stl
    - human_collision
    - human_future_trajectory # for falcon
    # - human_velocity_measure # DISABLED: Tricky implementation issues
  - lab_sensors:
    - localization_sensor
    - human_num_sensor # for falcon
    - oracle_humanoid_future_trajectory # for falcon
    # - human_velocity_sensor # DISABLED: Elliptical proximity penalty disabled (falls back to circular)
  - _self_

type: MultiAgentPointNavTask-v0
end_on_success: True
reward_measure: "multi_agent_nav_reward"
success_measure: "success"
success_reward: 10.0
slack_reward: -0.002
goal_sensor_uuid: pointgoal_with_gps_compass
measurements:
  multi_agent_nav_reward:
    type: MultiAgentNavReward
    use_geo_distance: true
    allow_distance: 2.0
    collide_scene_penalty: -0.005
    collide_human_penalty: -0.015
    close_to_human_penalty: -0.003
    trajectory_cover_penalty: -0.0005
    cover_future_dis_thre: 0.05
    robot_idx: 0
    facing_human_dis: 2.0
    # Elliptical penalty zone parameters (velocity-aware)
    ellipse_forward_expansion: 2.0    # Multiplier for forward expansion (2x base radius)
    ellipse_backward_shrink: 0.5      # Multiplier for backward shrinkage (0.5x base radius)
    ellipse_velocity_threshold: 0.1   # Minimum velocity (m/s) to activate elliptical penalty
    ellipse_velocity_scale: 1.0       # Scaling factor for velocity-to-radius conversion
    # Obstacle proximity penalty parameters (distance-based soft penalty for static obstacles)
    obstacle_proximity_penalty: -0.0015  # Penalty coefficient (gentler than human penalty)
    obstacle_proximity_threshold: 1.0    # Distance threshold in meters (obstacles within this range incur penalty)